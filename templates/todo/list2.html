{% extends "base.html" %}

{% block content %}


<div class="listcontainer">
    <h1>Todo List</h1>
    <button class="todoCreate" onclick="window.location.href='/todo/create/'">Create</button>
    <div class="pagination">
    </div>
</div>

<div class="pagination">
</div>

<script>
    // 현재 페이지 번호를 전역 변수로 관리
    let current_Page = 1;

    // 페이지 로드시
    $(document).ready(() => loadAndRenderTodos(current_Page));

    // Todo 리스트를 불러오고 렌더링하는 함수
    function loadAndRenderTodos(page) {
        current_Page = page; // 현재 페이지 번호 업데이트
        return axiosInstance.get(`/api/todo/viewsets/?page=${page}`)
        .then(function(response) {
            const todoHTML = response.data.data.map(renderTodoItem).join('');
            $(".listcontainer").find('.todo-item').remove();
            $(".listcontainer").append(todoHTML);
            $(".pagination").html(pageLink(response.data));
        })
        .catch(function(error) {
            console.log(error);
        });
    }

    // 페이징 링크 생성 - 현재 페이지 강조 표시
    function pageLink(pagination) {
        var pageLinks = "";
        // console.log(pagination.total_page);
        /*
        if (pagination.total_page > 1) {
            var currentPage = pagination.currnet_page;
            var totalPages = pagination.total_page;
            var maxDisplayedPages = 10;
            

            var startPage = Math.max(1, currentPage - 5);
            var endPage = Math.min(totalPages, currnetPage + 5);

            if (currnetPage - startPage < 5) {
                endPage = Math.min(endPage + (5 - (currnetPage - startPage)), totalPages);
            }
            if (endPage - currentPage < 5) {
                startPage = Math.max(startPage - (5 - (endPage - currentPage)), 1);
            }
        }
            */
        //console.log(currentPage);
        //console.log(totalPage);
        //console.log(endPage);
        for (var i = 1; i <= pagination.total_page; i++) {
            const activeClass = i === current_Page ? 'active' : '';
            pageLinks += `<a href="#" class="page-link ${activeClass}" onclick="loadAndRenderTodos(${i})">${i}</a>`;
        }
        return pageLinks;
    }

    // Todo 아이템을 렌더링하는 함수를 분리
    function renderTodoItem(todo) {
        const completionButton = !todo.complete ? `<button class="todoUpdate" onclick="toComplete(${todo.id}, event)">완료</button>` : '';
        return `
            <div class="todo-item" onclick="detailView(${todo.id})">
                <p><strong>Name:</strong> ${todo.name}</p>
                <p><strong>Description:</strong> ${todo.description}</p>
                <p><strong>Complete:</strong>
                    <label class="custom-checkbox">
                        <input type="checkbox" ${todo.complete ? 'checked' : ''} disabled>
                        <span class="checkmark"></span>
                    </label>
                 </p>
                <p><strong>Completed At:</strong> ${datetimeToString(todo.completed_at)}</p>
                <p><strong>Experience Points:</strong> ${todo.exp}</p>
                ${completionButton}
            </div>
        `;
    }

    function detailView(id) {
        window.location.href = `/todo/${id}/`;
    }

    function toComplete(id, event) {
        event.stopPropagation();
        
        // 현재 완료한 todo 아이템의 위치를 찾습니다
        const completedItem = $(event.target).closest('.todo-item');
        const itemOffset = completedItem.offset().top - $(window).scrollTop();
        
        axiosInstance.patch(`/api/todo/update/${id}/`, {
            complete: true,
        })
        .then(function(response) {
            // 현재 페이지 번호를 유지하면서 데이터를 새로 불러옵니다
            loadAndRenderTodos(current_Page).then(() => {
                const newItem = $(`.todo-item:contains(${completedItem.find('p:first').text()})`);
                if (newItem.length) {
                    const newScrollTop = newItem.offset().top - itemOffset;
                    $(window).scrollTop(newScrollTop);
                }
            });
        })
        .catch(function(error) {
            console.log(error);
        });
    }
</script>

{% endblock %}
