{% extends "base.html" %}

{% block content %}

    <h1>Todo Update</h1>

    <div class="container">
        <h2>Update Todo</h2>    
        <div>
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" maxlength="100" required>
        </div>
        <div>
            <label for="description">Description:</label>
            <textarea id="description" name="description"></textarea>
        </div>
        <div>
            <label for="complete">Complete:</label>
            <input type="checkbox" id="complete" name="complete">
        </div>
        <div>
            <label for="exp">Experience Points:</label>
            <input type="number" id="exp" name="exp" min="0" value="0">
        </div>
        <div>
            <button class="todoUpdate" type="submit" id="todoUpdate">Update</button>
        </div>
    </div>

    <script>
        // 페이지 로드시 값을 넣어준다
        $(document).ready(function() {
            pk = window.location.href.split('/').filter(Boolean).pop();
            axiosInstance.get(`/api/todo/retrieve/${pk}`)
            .then(function(response) {
                todo = response.data;
                $("#name").val(todo.name);
                $("#description").val(todo.description);
                $("#complete").prop("checked", todo.complete);
                $("#exp").val(todo.exp);
            })
            .catch(function(error) {
                console.log(error);
                alert("Todo 생성에 실패했습니다.");
            })
        })

        // 버튼이 클릭된다면
        $("#todoUpdate").on("click", function() {
            pk = window.location.href.split('/').filter(Boolean).pop();
            axiosInstance.patch(`/api/todo/update/${pk}/`, {
                name: $("#name").val(),
                description: $("#description").val(),
                complete: $("#complete").is(":checked"),
                exp: $("#exp").val(),
            })
            .then(function(response) {
                window.location.href = `/todo/${pk}/`;
            })
            .catch(function(error) {
                console.log(error);
                alert("Todo 수정에 실패했습니다.");
            })
        })
    </script>

{% endblock %}
