{% extends "base.html" %}

{% block content %}

<div class="listcontainer">
    <h1>Todo List</h1>
</div>

<script>
    $(document).ready(function() {
        axiosInstance.get("/api/task/todo/list/")
        .then(function(response) {
            for (var i = 0; i < response.data.length; i++) {
                var todo = response.data[i];
                var todoElement = `
                    <div class="todo-item">
                        <p><strong>해야할 일:</strong> ${todo.must}</p>
                        <p><strong>작성:</strong> ${todo.datetime}</p>
                        <p><strong>완료:</strong> ${todo.checkbox}</p>
                    </div>
                `
                $(".listcontainer").append(todoElement)
            }
        })
        .catch(function(error) {
            console.log(error)
        })
    })
</script>

{% endblock %}
